<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>无线网管平台 - 室外 AP 点位分布</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .campus-layout {
            display: flex;
            height: calc(100vh - var(--topbar-height));
            margin-top: var(--topbar-height);
        }

        /* 左侧 AP 列表面板 */
        .ap-list-panel {
            width: 300px;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ap-search-box {
            position: relative;
        }

        .ap-search-box input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .ap-search-box input:focus {
            border-color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(168, 37, 227, 0.1);
        }

        .ap-search-box::before {
            content: '🔍';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
        }

        .ap-list-stats {
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .ap-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .ap-pool-item {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 6px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .ap-pool-item:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .ap-pool-item:active { cursor: grabbing; opacity: 0.7; }

        .ap-pool-item.placed {
            opacity: 0.4;
            border-style: dashed;
        }

        .ap-pool-item .ap-name {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }

        .ap-pool-item .ap-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ap-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .ap-status-dot.online { background: var(--color-online); }
        .ap-status-dot.offline { background: var(--color-offline); }

        /* 右侧地图区域 */
        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            background: rgba(255, 255, 255, 0.3);
        }

        .map-container {
            position: relative;
            display: inline-block;
        }

        .map-img {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
        }

        .map-container.drag-over {
            outline: 3px dashed rgba(168, 37, 227, 0.5);
            outline-offset: -3px;
        }

        /* AP 标记 */
        @keyframes pulse-online {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 47, 167, 0.6); }
            50% { box-shadow: 0 0 0 10px rgba(0, 47, 167, 0); }
        }
        @keyframes pulse-offline {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .ap-placed-marker {
            position: absolute;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 100;
        }

        .ap-placed-marker:hover { z-index: 200; }
        .ap-placed-marker:active { cursor: grabbing; }

        .ap-marker-ring {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ap-marker-ring.online {
            background: #002FA7;
            animation: pulse-online 2s ease-in-out infinite;
        }
        .ap-marker-ring.offline {
            background: #ef4444;
            animation: pulse-offline 2s ease-in-out infinite;
        }

        .ap-marker-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
        }

        .ap-marker-label {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            white-space: nowrap;
            color: var(--text-secondary);
            text-shadow: 0 0 3px white, 0 0 3px white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .ap-placed-marker:hover .ap-marker-label { opacity: 1; }

        .ap-marker-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 300;
        }

        .ap-placed-marker:hover .ap-marker-tooltip { opacity: 1; }

        .tt-name { font-weight: 700; color: var(--text-primary); font-size: 13px; }
        .tt-detail { color: var(--text-muted); margin-top: 2px; }

        /* 工具栏 */
        .map-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 500;
        }

        .fp-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fp-btn:hover { background: var(--bg-card-hover); }
        .fp-btn.danger { color: var(--color-offline); border-color: var(--color-offline); }
        .fp-btn.danger:hover { background: rgba(212, 24, 58, 0.1); }

        /* 缩放 */
        .zoom-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 500;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .zoom-btn:hover { background: var(--bg-card-hover); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <h1 class="logo">
                <span class="logo-icon">&#9678;</span>
                无线网管平台
            </h1>
        </div>
        <div class="top-bar-center">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">已放置</span>
                    <span class="stat-value" id="stat-placed">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未放置</span>
                    <span class="stat-value" id="stat-unplaced">0</span>
                </div>
            </div>
        </div>
        <div class="top-bar-right">
            <span class="refresh-info">
                室外 AP 分布 |
                <a href="/" style="color:var(--text-primary);text-decoration:none;font-weight:600">总览 &rarr;</a>
                | <a href="/ap-status" style="color:var(--text-primary);text-decoration:none;font-weight:600">AP 状态 &rarr;</a>
            </span>
        </div>
    </header>

    <div class="campus-layout">
        <!-- 左侧 AP 列表 -->
        <aside class="ap-list-panel">
            <div class="panel-header">
                <h3>室外 AP 搜索 & 拖放</h3>
                <div class="ap-search-box">
                    <input type="text" id="ap-search" placeholder="输入 AP 名称搜索..." autocomplete="off">
                </div>
            </div>
            <div class="ap-list-stats">
                <span>显示 <strong id="filter-count">0</strong> / <span id="total-count">0</span></span>
                <span>已放置 <strong id="placed-count">0</strong></span>
            </div>
            <div class="ap-list-scroll" id="ap-pool">
                <div class="empty-state">
                    <div class="icon">&#128225;</div>
                    <p>正在加载 AP 列表...</p>
                </div>
            </div>
        </aside>

        <!-- 右侧校园地图 -->
        <div class="map-area" id="map-area">
            <div class="map-toolbar">
                <button class="fp-btn" id="btn-save" title="保存布局">&#128190; 保存</button>
                <button class="fp-btn danger" id="btn-clear" title="清除所有放置">&#128465; 清除</button>
            </div>

            <div class="map-container" id="map-container">
                <img class="map-img" id="map-img"
                     src="{{ url_for('static', filename='images/campus.png') }}"
                     alt="校园总图" draggable="false">
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in" title="放大">+</button>
                <button class="zoom-btn" id="zoom-out" title="缩小">&minus;</button>
                <button class="zoom-btn" id="zoom-reset" title="重置" style="font-size:12px">1:1</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/campus_ap.js') }}?v={{ range(1,99999)|random }}"></script>
</body>
</html>
