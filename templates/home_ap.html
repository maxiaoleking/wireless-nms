<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无线网管平台 - Home AP 布局</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Home AP 布局页专用样式 */
        .home-layout {
            display: flex;
            height: calc(100vh - var(--topbar-height));
            margin-top: var(--topbar-height);
        }

        /* 左侧 AP 列表面板 */
        .ap-list-panel {
            width: 280px;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px;
        }

        .ap-list-panel h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ap-pool-item {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .ap-pool-item:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .ap-pool-item:active {
            cursor: grabbing;
            opacity: 0.7;
        }

        .ap-pool-item.placed {
            opacity: 0.4;
            border-style: dashed;
        }

        .ap-pool-item .ap-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .ap-pool-item .ap-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ap-pool-item .ap-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .ap-pool-item .ap-status-dot.online { background: var(--color-online); }
        .ap-pool-item .ap-status-dot.offline { background: var(--color-offline); }

        /* 右侧平面图区域 */
        .floorplan-area {
            flex: 1;
            position: relative;
            overflow: auto;
            background: rgba(255, 255, 255, 0.3);
        }

        .floorplan-container {
            position: relative;
            display: inline-block;
            min-width: 100%;
            min-height: 100%;
        }

        .floorplan-img {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
        }

        /* 拖放区域高亮 */
        .floorplan-container.drag-over {
            outline: 3px dashed rgba(168, 37, 227, 0.5);
            outline-offset: -3px;
        }

        /* 已放置的 AP 标记 */
        .ap-placed-marker {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 100;
            transition: box-shadow 0.2s;
        }

        .ap-placed-marker:hover {
            z-index: 200;
        }

        .ap-placed-marker:active {
            cursor: grabbing;
        }

        .ap-marker-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .ap-marker-ring.online {
            border-color: var(--color-online);
        }

        .ap-marker-ring.offline {
            border-color: var(--color-offline);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .ap-marker-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-primary);
        }

        .ap-marker-star {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 16px;
            line-height: 1;
        }

        .ap-marker-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 300;
        }

        .ap-placed-marker:hover .ap-marker-tooltip {
            opacity: 1;
        }

        .ap-marker-tooltip .tt-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 13px;
        }

        .ap-marker-tooltip .tt-detail {
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 拖拽中的幽灵元素 */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: translate(-50%, -50%);
        }

        /* 工具栏 */
        .floorplan-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 500;
        }

        .fp-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fp-btn:hover {
            background: var(--bg-card-hover);
        }

        .fp-btn.danger {
            color: var(--color-offline);
            border-color: var(--color-offline);
        }

        .fp-btn.danger:hover {
            background: rgba(212, 24, 58, 0.1);
        }

        /* 区域选择 */
        .region-selector {
            margin-bottom: 16px;
        }

        .region-selector select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .region-selector select:focus {
            border-color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.85);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* 缩放控制 */
        .zoom-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 500;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--bg-card-hover);
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <h1 class="logo">
                <span class="logo-icon">&#9678;</span>
                无线网管平台
            </h1>
        </div>
        <div class="top-bar-center">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">已放置</span>
                    <span class="stat-value" id="stat-placed">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">未放置</span>
                    <span class="stat-value" id="stat-unplaced">0</span>
                </div>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="nav-links">
                <a href="/" class="nav-link">入口</a>
                <a href="/dashboard" class="nav-link">总览</a>
                <a href="/ap-status" class="nav-link">AP 状态</a>
                <a href="/campus-ap" class="nav-link">室外点位</a>
                <a href="/home-ap" class="nav-link active">家宽 AP</a>
                <a href="/ctrl-perf" class="nav-link">控制器</a>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="home-layout">
        <!-- 左侧 AP 列表 -->
        <aside class="ap-list-panel">
            <div class="region-selector">
                <h3>选择控制器</h3>
                <select id="region-select">
                    {% for key, cfg in regions.items() %}
                    <option value="{{ key }}">{{ cfg.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <h3>AP 列表 <span id="ap-count" style="color:var(--text-muted);font-weight:400;font-size:12px">(0)</span></h3>
            <div id="ap-pool">
                <div class="empty-state">
                    <div class="icon">&#128225;</div>
                    <p>选择控制器加载 AP 列表</p>
                </div>
            </div>
        </aside>

        <!-- 右侧平面图 -->
        <div class="floorplan-area" id="floorplan-area">
            <div class="floorplan-toolbar">
                <button class="fp-btn" id="btn-save" title="保存布局">&#128190; 保存</button>
                <button class="fp-btn danger" id="btn-clear" title="清除所有放置">&#128465; 清除</button>
            </div>

            <div class="floorplan-container" id="floorplan-container">
                <img class="floorplan-img" id="floorplan-img"
                     src="{{ url_for('static', filename='images/lab.jpg') }}"
                     alt="平面图" draggable="false">
                <!-- AP 标记将动态添加到这里 -->
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in" title="放大">+</button>
                <button class="zoom-btn" id="zoom-out" title="缩小">&minus;</button>
                <button class="zoom-btn" id="zoom-reset" title="重置" style="font-size:12px">1:1</button>
            </div>
        </div>
    </div>

    <script>
        window.REGIONS = {{ regions | tojson }};
        window.FLOORPLAN_IMG = "{{ url_for('static', filename='images/lab.jpg') }}";
    </script>
    <script src="{{ url_for('static', filename='js/home_ap.js') }}"></script>
</body>
</html>
